<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frontend dev day5</title>
</head>

<body>
    <form action="">
        <!-- placeholderis a tag in this we use to write content  -->
        <label>NAME:</label>
        <br>
        <input id="name" placeholder="enter your name" type="text" required></input>
        <br>
        <br>
        <label>EMAIL:</label>
        </br>
        <input type="password" placeholder="enter your password" type="password" required>
        <br>
        <br>
        <label>DOB</label>
        <br>
        <input type="date">
        <br />
        <br>

  
    <label>SELECT YOUR PREFERRED TECHNOLOGY:</label>
    <br />
    <select>
        <option value="html">html</option>
        <option value="css">css</option>
        <option value="js">js</option>
    </select>
    <br>
    <br>
    <label>GENDER:</label>
    <br />
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female">female
    <input type="radio" name="gender" value="other">other
    <br>
    <br>
    <label for="description">Description:</label>
    <br />
    <textarea name="description" id="description" cols="30" rows="10"></textarea>
    <br>
    <input type="checkbox" />
    <label>terms and conditions</label>
    <br>
    <br />
    <input type="submit" ></input>
</form>

</body>

</html>
